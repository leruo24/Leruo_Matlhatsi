<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeruOS — Leruo Matlhatsi</title>
  <meta name="description" content="Portfolio of Leruo Matlhatsi — software developer and Information Systems student at UCT." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5c43'/%3E%3Cpath d='M16 6c-5 4-7 9-5 14 1 3 3 5 5 6 2-1 4-3 5-6 2-5 0-10-5-14z' fill='%239be37d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="os.css" />
</head>
<body>
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 32 32" width="72" height="72" aria-hidden="true"><path d="M16 3c-6 5-8.5 11-6 17 1.2 3.4 3.5 5.6 6 7 2.5-1.4 4.8-3.6 6-7 2.5-6 0-12-6-17z" fill="#9be37d"/><path d="M16 9v18" stroke="#0e2a1e" stroke-width="1.6"/></svg>
      <div class="splash-name">Leru<b>OS</b> <span>26</span></div>
    </div>
    <div class="splash-bar"><i></i></div>
  </div>

  <a id="back-to-room" href="../index.html" hidden>← Back to the workshop</a>

  <main id="desktop" aria-label="Desktop">
    <div class="wallpaper" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="120" height="120"><path d="M16 3c-6 5-8.5 11-6 17 1.2 3.4 3.5 5.6 6 7 2.5-1.4 4.8-3.6 6-7 2.5-6 0-12-6-17z" fill="rgba(155,227,125,.16)"/></svg>
      <div class="wp-name"></div>
    </div>
    <ul id="icons" role="list"></ul>
    <div id="windows"></div>
  </main>

  <nav id="start-menu" hidden>
    <div class="sm-band"><span>Leru<b>OS</b> 26</span></div>
    <ul id="start-items"></ul>
  </nav>

  <footer id="taskbar">
    <button id="start-btn" class="tb-start" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true"><path d="M16 3c-6 5-8.5 11-6 17 1.2 3.4 3.5 5.6 6 7 2.5-1.4 4.8-3.6 6-7 2.5-6 0-12-6-17z" fill="#2f8f4e"/></svg>
      <b>Start</b>
    </button>
    <div id="tasks"></div>
    <div class="tray"><span id="clock"></span></div>
  </footer>

  <div id="crt" aria-hidden="true"></div>

  <script src="content.js"></script>
  <script src="os.js"></script>
</body>
</html>
