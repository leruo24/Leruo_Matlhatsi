<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leruo · Scene keyframes</title><style>body{margin:0;background:#101812;color:#edf1e5;font:16px system-ui}header,nav{padding:20px 4vw}h1{font:32px Georgia;margin:0 0 8px}p{color:#b9c5b7}button{background:#263b2c;color:inherit;border:1px solid #566b50;border-radius:18px;padding:10px 16px;margin:4px;cursor:pointer}button[aria-current=true]{background:#dce8c8;color:#132017}figure{margin:0 4vw}img{display:block;width:100%;max-height:74vh;object-fit:contain;background:#080c09}figcaption{padding:12px 0}</style><header><h1>Step into my ideal world</h1><p>Nine camera views · reference images for building the experience. Select a view below.</p></header><figure><img id="frame" alt=""><figcaption id="caption" aria-live="polite"></figcaption></figure><nav aria-label="Camera views"></nav><script>const views=[{"image": "00-office.png", "label": "Busy office", "role": "reference-keyframe"}, {"image": "01-headset-lift.jpg", "label": "Lift the headset", "role": "reference-keyframe"}, {"image": "02-vr-world-reveal.png", "label": "World reveal", "role": "reference-keyframe"}, {"image": "03-workshop-home.jpg", "label": "Workshop home", "role": "reference-keyframe"}, {"image": "04-workshop-left.png", "label": "Left angle", "role": "reference-keyframe"}, {"image": "05-workshop-right.png", "label": "Right angle", "role": "reference-keyframe"}, {"image": "06-seated-desk.png", "label": "Seated at desk", "role": "reference-keyframe"}, {"image": "07-monitor-entry.png", "label": "Enter the monitor", "role": "reference-keyframe"}, {"image": "08-hardware-bench.png", "label": "Hardware bench", "role": "reference-keyframe"}];let current=0;const nav=document.querySelector('nav'),img=document.querySelector('#frame'),caption=document.querySelector('#caption');views.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.label;b.onclick=()=>show(i);nav.append(b)});function show(i){current=(i+views.length)%views.length;img.src=views[current].image;img.alt=views[current].label;caption.textContent=(current+1)+' / '+views.length+' · '+views[current].label;[...nav.children].forEach((b,n)=>b.setAttribute('aria-current',String(n===current)))}addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});show(0);</script></html>
